name: eslint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm ci
        run: npm ci
        continue-on-error: true
      - name: eslint
        run: npx eslint src --ext .ts,.tsx
        continue-on-error: true
